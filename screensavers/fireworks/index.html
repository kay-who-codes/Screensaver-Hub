<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', serif;
    cursor: none;
  }

  canvas {
    display: block;
  }

  #ui {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: center;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  body:hover #ui {
    opacity: 1;
  }

  .btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.75);
    padding: 7px 18px;
    border-radius: 30px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    backdrop-filter: blur(6px);
  }

  .btn:hover {
    background: rgba(255,255,255,0.18);
    color: #fff;
  }

  .btn.active {
    background: rgba(255,255,255,0.22);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }

  #hint {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    animation: fadeHint 5s forwards;
  }

  @keyframes fadeHint {
    0%   { opacity: 1; }
    60%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hint">Click anywhere · Controls appear on hover</div>

<div id="ui">
  <button class="btn active" id="btnAuto">Auto</button>
  <button class="btn" id="btnTrails">Trails: On</button>
  <button class="btn" id="btnStars">Stars: On</button>
  <button class="btn" id="btnSound">Sound: Off</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// ---- Settings ----
let autoLaunch = true;
let trailsOn   = true;
let starsOn    = true;

// ---- Stars ----
const STAR_COUNT = 200;
const stars = Array.from({ length: STAR_COUNT }, () => ({
  x: Math.random() * 2000,
  y: Math.random() * 1200,
  r: Math.random() * 1.2 + 0.2,
  a: Math.random(),
  speed: Math.random() * 0.005 + 0.002
}));

function drawStars() {
  for (const s of stars) {
    s.a += s.speed;
    const alpha = 0.15 + 0.35 * Math.abs(Math.sin(s.a));
    ctx.beginPath();
    ctx.arc((s.x / 2000) * W, (s.y / 1200) * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

// ---- Colour palettes ----
const PALETTES = [
  ['#ff4444','#ff8800','#ffee00'],          // fire
  ['#00cfff','#0088ff','#aa44ff'],          // electric
  ['#ff44cc','#ff88aa','#ffccee'],          // rose
  ['#44ff88','#00ffcc','#88ffee'],          // jade
  ['#ffdd00','#ffaa00','#ff6600'],          // gold
  ['#cc44ff','#8844ff','#4488ff'],          // nebula
  ['#ff6644','#ffaa66','#ffddaa'],          // amber
  ['#ffffff','#aaddff','#88bbff'],          // silver
];

// ---- Particle ----
class Particle {
  constructor(x, y, vx, vy, color, size, life, gravity = 0.06, fade = 0.018) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
    this.gravity = gravity;
    this.fade = fade;
    this.trail = [];
  }

  update() {
    if (trailsOn) {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 6) this.trail.shift();
    } else {
      this.trail = [];
    }
    this.vx *= 0.985;
    this.vy *= 0.985;
    this.vy += this.gravity;
    this.x  += this.vx;
    this.y  += this.vy;
    this.life -= this.fade;
  }

  draw() {
    const alpha = Math.max(0, this.life / this.maxLife);

    // trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const ta = alpha * (i / this.trail.length) * 0.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(this.color, ta);
      ctx.fill();
    }

    // glow
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.5);
    g.addColorStop(0,   hexToRgba(this.color, alpha));
    g.addColorStop(1,   hexToRgba(this.color, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba('#ffffff', alpha * 0.9);
    ctx.fill();
  }

  get dead() { return this.life <= 0; }
}

// ---- Rocket ----
class Rocket {
  constructor(x, targetY) {
    this.x = x;
    this.y = H + 10;
    this.targetY = targetY;
    const speed = 8 + Math.random() * 5;
    const angle = (Math.PI * 1.5) + (Math.random() - 0.5) * 0.25;
    this.vx = Math.cos(angle) * speed * 0.25;
    this.vy = -speed;
    this.trail = [];
    this.exploded = false;
    this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    this.type = Math.floor(Math.random() * 6); // explosion type
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 12) this.trail.shift();
    this.vx *= 0.99;
    this.vy += 0.09;
    this.x += this.vx;
    this.y += this.vy;

    if (this.vy >= 0 || this.y <= this.targetY) {
      this.explode();
    }
  }

  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length) * 0.8;
      const r = 2 * (i / this.trail.length);
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,100,${a})`;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  explode() {
    this.exploded = true;
    const palette = this.palette;
    const cx = this.x, cy = this.y;
    const parts = [];

    switch (this.type) {
      case 0: // classic burst
        for (let i = 0; i < 90; i++) {
          const angle = (i / 90) * Math.PI * 2;
          const speed = 2 + Math.random() * 4;
          const color = palette[Math.floor(Math.random() * palette.length)];
          parts.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, color, 2.5, 1, 0.05, 0.012));
        }
        break;

      case 1: // double ring
        for (let ring = 0; ring < 2; ring++) {
          const count = 60 + ring * 20;
          const spd = 2.5 + ring * 2;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const color = palette[ring % palette.length];
            parts.push(new Particle(cx, cy, Math.cos(angle)*spd, Math.sin(angle)*spd, color, 2, 1, 0.04, 0.015));
          }
        }
        break;

      case 2: // star shape
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const color = palette[i % palette.length];
          for (let j = 0; j < 15; j++) {
            const spd = j * 0.28;
            parts.push(new Particle(cx, cy, Math.cos(angle)*spd, Math.sin(angle)*spd, color, 2, 1.2, 0.04, 0.013));
          }
        }
        break;

      case 3: // chrysanthemum
        for (let i = 0; i < 120; i++) {
          const angle = (i / 120) * Math.PI * 2;
          const speed = 1.5 + Math.abs(Math.sin(angle * 6)) * 4;
          const color = palette[Math.floor(Math.random() * palette.length)];
          parts.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, color, 2, 1.1, 0.03, 0.011));
        }
        break;

      case 4: // willow (drooping trails)
        for (let i = 0; i < 70; i++) {
          const angle = (i / 70) * Math.PI * 2;
          const speed = 2 + Math.random() * 3;
          const color = palette[Math.floor(Math.random() * palette.length)];
          parts.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, color, 2, 1.3, 0.09, 0.009));
        }
        break;

      case 5: // crackle (scattered)
        for (let i = 0; i < 50; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 7;
          const color = palette[Math.floor(Math.random() * palette.length)];
          parts.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, color, 1.8, 0.9, 0.06, 0.02));
        }
        // add flash
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 1.5;
          parts.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, '#ffffff', 3, 0.5, 0.02, 0.05));
        }
        break;
    }

    particles.push(...parts);
    flashes.push({ x: cx, y: cy, r: 0, maxR: 80 + Math.random()*40, alpha: 0.6, color: palette[0] });
  }
}

// ---- State ----
let particles = [];
let rockets   = [];
let flashes   = [];

// ---- Auto-launch ----
let lastLaunch = 0;
function maybeAutoLaunch(now) {
  if (!autoLaunch) return;
  const interval = 400 + Math.random() * 600;
  if (now - lastLaunch > interval) {
    lastLaunch = now;
    const x = W * 0.15 + Math.random() * W * 0.7;
    const targetY = H * 0.1 + Math.random() * H * 0.4;
    rockets.push(new Rocket(x, targetY));
  }
}

// ---- Click to launch ----
canvas.addEventListener('click', (e) => {
  const targetY = H * 0.05 + Math.random() * H * 0.3;
  rockets.push(new Rocket(e.clientX, targetY));
});

// ---- Flash effect ----
function updateFlashes() {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.r += 6;
    f.alpha -= 0.045;
    if (f.alpha <= 0) { flashes.splice(i, 1); continue; }
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0,   hexToRgba(f.color, f.alpha * 0.5));
    g.addColorStop(0.4, hexToRgba(f.color, f.alpha * 0.2));
    g.addColorStop(1,   hexToRgba(f.color, 0));
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

// ---- Helpers ----
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
}

// ---- Main loop ----
function loop(now) {
  requestAnimationFrame(loop);

  // Background fade
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  if (starsOn) drawStars();
  maybeAutoLaunch(now);

  updateFlashes();

  // Rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.update();
    if (!r.exploded) r.draw();
    else rockets.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    if (p.dead) { particles.splice(i, 1); continue; }
    p.draw();
  }
}

requestAnimationFrame(loop);

// ---- UI buttons ----
document.getElementById('btnAuto').addEventListener('click', function() {
  autoLaunch = !autoLaunch;
  this.textContent = autoLaunch ? 'Auto' : 'Manual';
  this.classList.toggle('active', autoLaunch);
});

document.getElementById('btnTrails').addEventListener('click', function() {
  trailsOn = !trailsOn;
  this.textContent = 'Trails: ' + (trailsOn ? 'On' : 'Off');
  this.classList.toggle('active', trailsOn);
});

document.getElementById('btnStars').addEventListener('click', function() {
  starsOn = !starsOn;
  this.textContent = 'Stars: ' + (starsOn ? 'On' : 'Off');
  this.classList.toggle('active', starsOn);
});

// Sound button (placeholder — no audio API needed)
document.getElementById('btnSound').addEventListener('click', function() {
  this.textContent = 'Sound: Off';
});
</script>
</body>
</html>
